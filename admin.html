<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bip · Espace formateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #E8EDF5; --ink: #1B2440; --soft: #56607A; --card: #fff; --chip: #E3E8F2; --bip: #FFC93C; --action: #FF6B4A; --ok: #138A5B; --ko: #D63A3F; --display: "Bricolage Grotesque", system-ui, sans-serif; --body: "Atkinson Hyperlegible", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--card); border-bottom: 2px solid var(--ink); }
  header .marque { font: 800 1.2rem var(--display); }
  header .marque span { background: var(--bip); border: 2px solid var(--ink); border-radius: 8px; padding: 0 8px; margin-left: 6px; }
  #qui { font-size: .9rem; color: var(--soft); }
  main { max-width: 1240px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
  h1, h2 { font-family: var(--display); letter-spacing: -.02em; margin: 0; }
  h1 { font-size: 2rem; } h2 { font-size: 1.35rem; }
  p { margin: 0; }
  .carte { background: var(--card); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 4px 4px 0 var(--ink); padding: 20px 22px; display: grid; gap: 14px; }
  .connexion { max-width: 460px; margin: 40px auto; }
  .surtitre { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--soft); }
  .form { display: grid; gap: 12px; }
  .form label { display: grid; gap: 4px; font-weight: 700; }
  input, select, textarea { font: inherit; padding: 9px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; color: var(--ink); }
  .btn { font: 700 .95rem var(--body); border: 2px solid var(--ink); border-radius: 999px; padding: 8px 16px; background: var(--card); color: var(--ink); cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  .btn-p { background: var(--action); color: #fff; justify-self: start; }
  .btn-mini { padding: 2px 10px; font-size: .8rem; box-shadow: none; }
  .lien { background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-decoration: underline; cursor: pointer; }
  .err { color: var(--ko); font-weight: 700; min-height: 1.2em; }
  .note { color: var(--soft); font-size: .9rem; }
  .chargement, .vide-gros { padding: 30px; text-align: center; color: var(--soft); }
  .vide { color: #8A93A8; }
  code, .code { font-family: var(--mono); }
  .chiffres { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .chiffres div { background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 12px 16px; display: grid; }
  .chiffres b { font: 800 1.8rem var(--display); }
  .chiffres span { color: var(--soft); font-size: .88rem; }
  .chiffres .alerte { background: #FFE3DE; }
  .outils { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
  .outils h2 { margin-right: auto; }
  .table-wrap { overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; }
  .table th { text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); padding: 6px 10px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
  .table td { padding: 10px; border-bottom: 1px solid #D6DCE8; vertical-align: top; }
  .table tbody tr[data-uid] { cursor: pointer; }
  .table tbody tr[data-uid]:hover, .table tbody tr[data-uid]:focus { background: #F4F7FC; outline: none; }
  .table-petit td, .table-petit th { padding: 6px 8px; font-size: .9rem; }
  tr.actuelle td { background: #FFF6DA; }
  .prog { display: grid; gap: 4px; min-width: 150px; }
  .prog-bar { height: 8px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; background: #fff; }
  .prog-bar span { display: block; height: 100%; background: var(--bip); }
  .projet-mini { display: block; margin-top: 4px; color: var(--soft); }
  .tag { display: inline-block; font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 1px 9px; border: 1.5px solid currentColor; margin: 0 2px 4px 0; white-space: nowrap; }
  .tag.rouge { color: var(--ko); background: #FFE3DE; } .tag.orange { color: #B45309; background: #FFF1DA; } .tag.gris { color: var(--soft); } .tag.vert { color: var(--ok); background: #E3F5EC; } .tag.jaune { color: #8A6100; background: #FFF4D1; }
  .ok { color: #C98A00; letter-spacing: 1px; }
  .groupe { border: 2px solid var(--chip); border-radius: 12px; padding: 8px 12px; }
  .groupe > summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  .groupe[open] > summary { margin-bottom: 8px; }
  .resume { color: var(--soft); }
  .code { background: var(--ink); color: #E6EAF4; border-radius: 10px; padding: 12px 14px; font-size: .82rem; line-height: 1.5; overflow-x: auto; white-space: pre; margin: 6px 0 0; }
  .entete-eleve { grid-template-columns: 1fr auto; align-items: center; }
  .projet { display: grid; gap: 8px; }
  .etape { border-left: 4px solid var(--chip); padding-left: 10px; }
  .etape.faite { border-color: var(--bip); }
  .explication { color: var(--soft); font-style: italic; margin-top: 2px; }
  .etapes { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
  .regles { width: 100%; font: 400 .82rem/1.45 var(--mono); background: var(--ink); color: #E6EAF4; border-radius: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  @media (max-width: 700px) { main { padding: 14px; } .entete-eleve { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><div class="marque">Bip<span>Formateur</span></div><div id="qui"></div></header>
<main id="app"><p class="chargement">Chargement…</p></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/admin-missions.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
